name: jobs_output_test
on:
    workflow_dispatch:
        inputs:
         name: 
            type: string
            required: true

jobs:
    step_output_test:
        runs-on: ubuntu-latest
        steps:
        - name: output generator
          id: version
          run: |
            echo "name=${{ inputs.name }}-${{ job.check_run_id  }}" >> $GITHUB_OUTPUT
        outputs:
            name: ${{ steps.version.outputs.name }}
    
    job_output_consumer:
        needs: step_output_test
        runs-on: ubuntu-latest
        steps:
        - name: Job output fetch
          run: echo "The job output is ${{ needs.step_output_test.outputs.name}}"
        - name: fetching workflow output
          id: workflow
          uses: ./.github/workflows/workflow_output.yaml@master
        outputs:
            Runner: ${{ steps.workflow.outputs.runner }}

    workflow_output_consumer:
        needs: job_output_consumer
        runs-on: ubuntu-latest
        steps: 
        - name: outputs display
          run: echo "The Runner was ${{ needs.job_output_consumer.outputs.Runner }}"
        

    


            

