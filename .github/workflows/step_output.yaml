name: jobs_output_test
on:
    workflow_dispatch:
        inputs:
         name: 
            type: string
            required: true

jobs:
    step_output_test:
        runs-on: ubuntu-latest
        steps:
        - name: output generator
          id: version
          run: |
            echo "name=${{ inputs.name }}-${{ job.check_run_id  }}" >> $GITHUB_OUTPUT
        outputs:
            name: ${{ steps.version.outputs.name }}
    
    job_output_consumer:
        needs: step_output_test
        runs-on: ubuntu-latest
        steps:
        - name: Job output fetch
          run: echo "The job output is ${{ needs.step_output_test.outputs.name}}"
        - name: fetching workflow output
          id: workflow
          uses: './.github/workflow/workflow_output.yaml'
        - name: using workflow output
          run: echo "The Runner is ${{ steps.workflow.outputs.runner }}"

        

    


            

