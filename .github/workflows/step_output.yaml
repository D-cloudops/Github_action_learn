name: jobs_output_test
on:
    workflow_dispatch:
        inputs:
         name: 
            type: string
            required: true

jobs:
    step_output_test:
        runs-on: ubuntu-latest
        steps:
        - name: output generator
          id: version
          run: |
            echo "name=${{ inputs.name }}-${{ job.check_run_id  }}" >> $GITHUB_OUTPUT
        outputs:
            name: ${{ steps.version.outputs.name }}
    
    job_output_consumer:
        needs: step_output_test
        runs-on: ubuntu-latest
        steps:
        - name: Job output fetch
          run: echo "The job output is ${{ needs.step_output_test.outputs.name}}"
    workflow_output_caller:
         uses: ./.github/workflows/workflow_output.yaml

    workflow_output_consumer:
        needs: workflow_output_callers
        runs-on: ubuntu-latest
        steps: 
        - name: outputs display
          run: echo "The Runner was ${{ needs.workflow_output_caller.outputs.runner }}"
        

    


            

