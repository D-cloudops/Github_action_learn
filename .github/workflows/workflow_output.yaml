name: workflow_output
on:
    workflow_call:
        outputs:
            runner:
                value: ${{ jobs.workflow_output.outputs.Runner }}

jobs:
    Workflow_output:
        runs-on: ubuntu:latest
        steps:
        - name: output-generator
          id: runner
          run: echo "Runner=$RUNNER_NAME" >> $GITHUB_OUTPUT

        outputs:
         Runner: ${{ steps.runner.outputs.Runner }}
        